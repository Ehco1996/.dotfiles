# --- Prefix (default: C-b) ---

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session switcher: <prefix>+o  (fzf UI, great for touch/mobile)
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# --- Mouse (touch scrolling on mobile SSH) ---
set -g mouse on

# --- Status bar ---
set -g status-style "bg=default,fg=white"
set -g status-left-length 120
set -g status-right-length 60
set -g status-interval 5   # refresh session list every 5s

# status-left: hostname | current session (bold cyan) | all sessions (dim, clickable)
# ##S inside #() escapes to literal #S so tmux list-sessions gets the right format flag
set -g status-left "#[fg=black,bg=yellow,bold] #h #[default] #[fg=cyan,bold] #S #[default,fg=white,dim]│ #(tmux list-sessions -F '##S' 2>/dev/null | tr '\n' ' ')#[default]"
set -g status-right "#{?SSH_CONNECTION,#[fg=black#,bg=red#,bold] SSH #[default] ,}#[fg=yellow]%m-%d %H:%M "
setw -g window-status-current-style "fg=cyan,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# --- Clickable session list ---
# Clicking status-left area (where sessions are shown) opens the built-in
# choose-tree popup; choose-tree itself supports mouse clicks to switch sessions.
bind-key -n MouseDown1StatusLeft   choose-tree -Zs
bind-key -n MouseDown1StatusDefault choose-tree -Zs

# --- Window title: show hostname ---
set -g set-titles on
set -g set-titles-string "[#h] #S:#W"

# --- TPM init (must be last line) ---
run '~/.tmux/plugins/tpm/tpm'
